[package]
name = "deliverer"
version = "0.1.0"
description = "Curio — desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "deliverer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }  # async sleep in the login poll

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
